name: Weekly Theme (biweekly, Mon 09:00 UTC)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'

permissions:
  contents: write

jobs:
  weekly-theme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Weekly Theme
        run: npm run weekly-theme
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          WEEKLY_THEME_CHANNEL: ${{ vars.WEEKLY_THEME_CHANNEL }}

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/theme-state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update theme state [skip ci]"
            git push
          else
            echo "No state changes to commit."
          fi
