name: This or That (biweekly, Wed 09:00 UTC)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 3'

permissions:
  contents: write

jobs:
  this-or-that:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run This or That
        run: npm run this-or-that
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          THIS_OR_THAT_CHANNEL: ${{ vars.THIS_OR_THAT_CHANNEL }}

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/poll-state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update poll state [skip ci]"
            git push
          else
            echo "No state changes to commit."
          fi
